<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030b08">

    <title>Amir Hossein Shad</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    #063d2c 0%,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 10% 80%,
                    #03251b 0%,
                    transparent 30%
                ),
                #030806;
        }

        /* BACKGROUND */

        body::before {
            content: "";
            position: fixed;

            width: 500px;
            height: 500px;

            background: #00ff9d;
            filter: blur(180px);
            opacity: .10;

            top: 10%;
            left: 50%;

            transform: translateX(-50%);

            pointer-events: none;

            animation:
                backgroundGlow 7s ease-in-out infinite alternate;
        }

        @keyframes backgroundGlow {

            from {
                opacity: .07;
                transform:
                    translateX(-50%)
                    scale(1);
            }

            to {
                opacity: .15;
                transform:
                    translateX(-50%)
                    scale(1.2);
            }
        }

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;
            pointer-events: none;

            z-index: 0;
        }

        .orb {
            position: absolute;

            border-radius: 50%;
            filter: blur(80px);
            opacity: .15;

            animation:
                float 12s ease-in-out infinite alternate;
        }

        .orb.one {
            width: 280px;
            height: 280px;

            background: #00ff9d;

            top: -100px;
            left: -80px;
        }

        .orb.two {
            width: 230px;
            height: 230px;

            background: #00b879;

            right: -80px;
            top: 35%;

            animation-delay: -4s;
        }

        .orb.three {
            width: 300px;
            height: 300px;

            background: #00ffd0;

            bottom: -160px;
            left: 35%;

            animation-delay: -7s;
        }

        @keyframes float {

            0% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(40px, -30px, 0)
                    scale(1.08);
            }

            100% {
                transform:
                    translate3d(-30px, 40px, 0)
                    scale(.95);
            }
        }

        /* PARTICLES */

        .particles {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 1;
        }

        .particle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #70ffd0;

            box-shadow:
                0 0 10px #00ff9d;

            opacity: .45;

            animation:
                particleMove linear infinite;
        }

        .particle:nth-child(1) {
            left: 10%;
            top: 20%;
            animation-duration: 10s;
        }

        .particle:nth-child(2) {
            left: 25%;
            top: 70%;
            animation-duration: 13s;
        }

        .particle:nth-child(3) {
            left: 40%;
            top: 35%;
            animation-duration: 9s;
        }

        .particle:nth-child(4) {
            left: 60%;
            top: 80%;
            animation-duration: 12s;
        }

        .particle:nth-child(5) {
            left: 75%;
            top: 25%;
            animation-duration: 11s;
        }

        .particle:nth-child(6) {
            left: 90%;
            top: 60%;
            animation-duration: 14s;
        }

        @keyframes particleMove {

            0% {
                transform:
                    translateY(0)
                    translateX(0);
            }

            50% {
                transform:
                    translateY(-100px)
                    translateX(30px);
            }

            100% {
                transform:
                    translateY(0)
                    translateX(0);
            }
        }

        /* CONTAINER */

        .container {
            width: 100%;
            max-width: 480px;

            padding:
                45px 20px 35px;

            margin: auto;

            text-align: center;

            position: relative;
            z-index: 2;
        }

        /* PROFILE */

        .profile {
            width: 145px;
            height: 145px;

            margin:
                0 auto 20px;

            border-radius: 50%;

            padding: 5px;

            background:
                linear-gradient(
                    135deg,
                    #00ff9d,
                    #00b879,
                    #00ffd0
                );

            box-shadow:
                0 0 20px #00d98a,
                0 0 60px rgba(0,255,157,.35);

            animation:
                profileGlow 3s ease-in-out infinite;
        }

        .profile img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            border:
                4px solid #030806;
        }

        @keyframes profileGlow {

            0%,
            100% {
                box-shadow:
                    0 0 20px rgba(0,255,157,.55),
                    0 0 60px rgba(0,255,157,.25);
            }

            50% {
                box-shadow:
                    0 0 30px rgba(0,255,157,.8),
                    0 0 90px rgba(0,255,157,.35);
            }
        }

        /* NAME */

        h1 {
            font-size: 34px;

            margin-bottom: 8px;

            letter-spacing: 1px;
        }

        h1 span {
            color: #00ff9d;

            text-shadow:
                0 0 10px #00ff9d,
                0 0 25px rgba(0,255,157,.6);
        }

        .subtitle {
            color: #9ab5aa;

            font-size: 15px;

            letter-spacing: 4px;

            margin-bottom: 35px;
        }

        .line {
            width: 70px;
            height: 3px;

            background: #00ff9d;

            margin:
                0 auto 30px;

            border-radius: 20px;

            box-shadow:
                0 0 15px #00ff9d;
        }

        /* BUTTONS */

        .buttons {
            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .btn {
            width: 100%;

            min-height: 78px;

            display: flex;

            align-items: center;

            padding:
                12px 18px;

            text-decoration: none;

            color: white;

            border-radius: 20px;

            background:
                linear-gradient(
                    110deg,
                    rgba(0,180,120,.28),
                    rgba(2,20,14,.92)
                );

            border:
                1px solid rgba(0,255,157,.55);

            box-shadow:
                0 0 12px rgba(0,255,157,.18),
                inset 0 0 20px rgba(0,255,157,.06);

            transition:
                all .25s ease;

            direction: ltr;

            position: relative;

            overflow: hidden;
        }

        .btn::before {
            content: "";

            position: absolute;

            width: 120px;
            height: 120px;

            background: #00ff9d;

            border-radius: 50%;

            filter: blur(70px);

            opacity: 0;

            left: -50px;

            transition: .3s;
        }

        .btn:hover {
            transform:
                translateY(-4px)
                scale(1.015);

            border-color:
                #00ffb0;

            box-shadow:
                0 0 20px rgba(0,255,157,.55),
                0 0 50px rgba(0,255,157,.18);

            background:
                linear-gradient(
                    110deg,
                    rgba(0,200,130,.45),
                    rgba(2,25,17,.96)
                );
        }

        .btn:hover::before {
            opacity: .10;
        }

        /* ICONS */

        .icon {
            width: 50px;
            height: 50px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 23px;

            margin-right: 15px;

            position: relative;
            z-index: 2;

            box-shadow:
                0 0 15px rgba(0,255,157,.45);
        }

        .phone-icon {
            background: #00d98a;
            color: #00150d;
        }

        .instagram-icon {
            background:
                radial-gradient(
                    circle at 30% 110%,
                    #ffd600 0%,
                    #ff7a00 25%,
                    #ff0169 55%,
                    #d300c5 75%,
                    #7638fa 100%
                );

            color: white;
        }

        .telegram-icon {
            background: #229ED9;
            color: white;
        }

        .whatsapp-icon {
            background: #25D366;
            color: white;
        }

        /* TEXT */

        .text {
            flex: 1;

            text-align: left;

            position: relative;
            z-index: 2;
        }

        .text strong {
            display: block;

            font-size: 18px;

            margin-bottom: 0;
        }

        /* ARROW */

        .arrow {
            font-size: 30px;

            color: #70ffd0;

            margin-left: 8px;

            transition: .25s;

            position: relative;
            z-index: 2;
        }

        .btn:hover .arrow {
            transform:
                translateX(5px);

            text-shadow:
                0 0 15px #00ff9d;
        }

        /* EXTRA OPTIONS */

        .options {
            display: grid;

            grid-template-columns:
                repeat(2,1fr);

            gap: 12px;

            margin-top: 18px;
        }

        .option {
            min-height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            color: #d8fff0;

            background:
                rgba(0,255,157,.055);

            border:
                1px solid rgba(0,255,157,.25);

            border-radius: 16px;

            cursor: pointer;

            font-size: 13px;

            transition: .25s;
        }

        .option i {
            color: #00ff9d;
        }

        .option:hover {
            transform:
                translateY(-3px);

            border-color:
                #00ff9d;

            background:
                rgba(0,255,157,.12);

            box-shadow:
                0 0 20px rgba(0,255,157,.15);
        }

        /* FOLLOW */

        .follow {
            margin-top: 40px;
        }

        .follow-title {
            color: #d7eee4;

            font-size: 18px;

            margin-bottom: 18px;
        }

        .socials {
            display: flex;

            justify-content: center;

            gap: 18px;
        }

        .social {
            width: 52px;
            height: 52px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            color: white;

            text-decoration: none;

            background:
                #061710;

            font-size: 20px;

            transition: .25s;

            border:
                1px solid rgba(0,255,157,.35);

            box-shadow:
                0 0 12px rgba(0,255,157,.25);
        }

        .social.instagram {
            border-color: #ff2d95;
        }

        .social.telegram {
            border-color: #229ED9;
        }

        .social.whatsapp {
            border-color: #25D366;
        }

        .social:hover {
            transform:
                scale(1.15);

            box-shadow:
                0 0 25px rgba(0,255,157,.45);
        }

        .social.instagram:hover {
            background: #E1306C;
        }

        .social.telegram:hover {
            background: #229ED9;
        }

        .social.whatsapp:hover {
            background: #25D366;
        }

        /* TOAST */

        .toast {
            position: fixed;

            left: 50%;

            bottom: 25px;

            transform:
                translate(-50%,30px);

            opacity: 0;

            pointer-events: none;

            z-index: 100;

            padding:
                13px 20px;

            border-radius: 15px;

            background:
                rgba(3,20,13,.96);

            border:
                1px solid rgba(0,255,157,.55);

            box-shadow:
                0 0 25px rgba(0,255,157,.25);

            color:
                #d5fff0;

            font-size: 13px;

            transition:
                .3s;
        }

        .toast.show {
            opacity: 1;

            transform:
                translate(-50%,0);
        }

        /* FOOTER */

        .footer {
            margin-top: 30px;

            color:
                #49665b;

            font-size: 10px;

            letter-spacing: 2px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .container {
                padding:
                    35px 15px 30px;
            }

            .profile {
                width: 125px;
                height: 125px;
            }

            h1 {
                font-size: 29px;
            }

            .btn {
                min-height: 72px;
            }

            .icon {
                width: 45px;
                height: 45px;
            }
        }

    </style>
</head>


<body>


    <!-- BACKGROUND -->

    <div class="background">

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

    </div>


    <!-- PARTICLES -->

    <div class="particles">

        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

    </div>


    <!-- MAIN -->

    <main class="container">


        <!-- PROFILE -->

        <div class="profile">

            <img
                src="profile.jpg"
                alt="Amir Hossein Shad">

        </div>


        <!-- NAME -->

        <h1>
            Amir <span>Hossein Shad</span>
        </h1>


        <div class="subtitle">
            STAY CONNECTED
        </div>


        <div class="line"></div>


        <!-- MAIN BUTTONS -->

        <div class="buttons">


            <!-- PHONE -->

            <a
                class="btn"
                href="tel:+989384704646">

                <div class="icon phone-icon">
                    <i class="fa-solid fa-phone"></i>

                </div>

                <div class="arrow">

                </div>

            <!-- INSTAGRAM -->

            <a
                class="btn"

                rel="noopener">

                <div class="icon instagram-icon">
                    <i class="fa-brands fa-instagram"></i>
                </div>

                <div class="text">
                    <strong>Instagram</strong>
                </div>

                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- TELEGRAM -->

            <a
                class="btn"
                href="https://t.me/Amirm_shad"
                target="_blank"
                rel="noopener">

                <div class="icon telegram-icon">
                    <i class="fa-brands fa-telegram"></i>
                </div>

                <div class="text">

                </div>

                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- WHATSAPP -->

            <a
                class="btn"
                href="https://wa.me/989384704646"
                target="_blank"
                rel="noopener">

                <div class="icon whatsapp-icon">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>

                <div class="text">

                </div>

                    ›

        <!-- EXTRA OPTIONS -->

        <div class="options">


            <!-- SHARE -->

            <div
                class="option"
                onclick="sharePage()">

                <i class="fa-solid fa-share-nodes"></i>

                <span>Share</span>

            </div>


            <!-- ADD CONTACT -->

            <div
                class="option"
                onclick="addContact()">

                <i class="fa-solid fa-address-card"></i>

            <!-- COPY PHONE -->

                class="option"
                onclick="copyText('+989384704646')">

        <!-- FOLLOW -->

        <div class="follow">

            <div class="follow-title">
                — &nbsp; Follow Me &nbsp; —
            </div>


            <div class="socials">


                <!-- INSTAGRAM -->

                <a
                    class="social instagram"
                    href="https://instagram.com/amirmshad"
                    target="_blank"
                    rel="noopener">

                    <i class="fa-brands fa-instagram"></i>

                </a>


                <!-- TELEGRAM -->

                <a
                    class="social telegram"
                    href="https://t.me/Amirm_shad"
                    target="_blank"
                    rel="noopener">

                    <i class="fa-brands fa-telegram"></i>

                </a>


                <!-- WHATSAPP -->

                <a
                    class="social whatsapp"
                    href="https://wa.me/989384704646"
                    target="_blank"
                    rel="noopener">

                    <i class="fa-brands fa-whatsapp"></i>

                </a>


            </div>

        </div>


        <div class="footer">
            AMIR HOSSEIN SHAD
        </div>


    </main>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast">
    </div>


    <script>

        /* TOAST */

        function showToast(message) {

            const toast =
                document.getElementById("toast");

            toast.textContent = message;

            toast.classList.add("show");

            setTimeout(() => {

                toast.classList.remove("show");

            }, 2200);
        }


        /* COPY PHONE */

        async function copyText(text) {

            try {

                await navigator.clipboard.writeText(text);

                showToast(
                    "Phone number copied ✓"
                );

            } catch {

                showToast(
                    "Copy failed"
                );

            }
        }


        /* SHARE */

        async function sharePage() {

            const shareData = {

                title:
                    "Amir Hossein Shad",

                text:
                    "Connect with Amir Hossein Shad",

                url:
                    window.location.href
            };


            if (navigator.share) {

                try {

                    await navigator.share(
                        shareData
                    );

                } catch {

                }

            } else {

                await copyText(
                    window.location.href
                );

                showToast(
                    "Link copied ✓"
                );
            }
        }


        /* ADD CONTACT */

        function addContact() {

            const vcard =

`BEGIN:VCARD
VERSION:3.0
FN:Amir Hossein Shad
TEL:+989384704646
URL:https://instagram.com/amirmshad
URL:https://t.me/Amirm_shad
END:VCARD`;


            const blob =
                new Blob(
                    [vcard],
                    {
                        type:
                            "text/vcard"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");

            link.href = url;

            link.download =
                "Amir-Hossein-Shad.vcf";

            document.body.appendChild(link);

            link.click();

            link.remove();

            URL.revokeObjectURL(url);

            showToast(
                "Contact created ✓"
            );
        }


        /* ADD TO HOME */

        let deferredPrompt = null;


        window.addEventListener(
            "beforeinstallprompt",
            (event) => {

                event.preventDefault();

                deferredPrompt = event;

            }
        );


        async function addHome() {

            if (!deferredPrompt) {

                showToast(
                    "Use your browser menu to Add to Home"
                );

                return;
            }


            deferredPrompt.prompt();


            const {
                outcome
            } =
                await deferredPrompt.userChoice;


            if (
                outcome === "accepted"
            ) {

                showToast(
                    "Added to Home Screen ✓"
                );

            }


            deferredPrompt = null;
        }

    </script>

</body>
